services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_partitioning_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: partitioning_demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    build: .
    container_name: fastapi_partitioning_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/partitioning_demo
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
