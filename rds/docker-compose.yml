version: '3.8'

services:
  storage-manager:
    build:
      context: .
      dockerfile: storage-manager.Dockerfile
    container_name: aps08-storage-manager
    privileged: true
    network_mode: host
    volumes:
      - /mnt/wsl:/mnt/wsl:rshared
      - /dev:/dev
      - ${HOME}:/root
      - ./scripts:/scripts
    healthcheck:
      test: ["CMD-SHELL", "mountpoint -q /mnt/wsl/aps08_rds_sim"]
      interval: 2s
      timeout: 2s
      retries: 5

  db:
    image: postgres:15
    container_name: aps08-rds-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/wsl/aps08_rds_sim:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      storage-manager:
        condition: service_healthy

  app:
    build: ./app
    container_name: aps08-rds-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    volumes:
      - /mnt/wsl/aps08_rds_sim:/mnt/wsl/aps08_rds_sim
    depends_on:
      db:
        condition: service_healthy
