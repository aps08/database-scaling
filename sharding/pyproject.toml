[project]
name = "sharding"
version = "0.1.0"
description = "Scalable 4-node database sharding application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[project.scripts]
start-app = "fastapi.cli:main"
